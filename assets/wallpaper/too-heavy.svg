<g clip-path="url(#toohe_b5)"><use class="slice" href="#toohe_skull" transform="translate(24 0)" style="--j:20px;animation-delay:-7.18s"/></g>
<g clip-path="url(#toohe_b6)"><use class="slice" href="#toohe_skull" transform="translate(0 0)" style="--j:16px;animation-delay:-3.88s"/></g>
