l="#121212"/><path d="M500,230 C650,230 740,320 740,440 C740,520 705,565 675,595 L675,660 C675,690 655,700 640,700 L360,700 C345,700 325,690 325,660 L325,595 C295,565 260,520 260,440 C260,320 350,230 500,230 Z" fill="none" stroke="#7fff00" stroke-width="4" transform="translate(-22 8)" class="flicker" style="animation-duration:5s"/>
