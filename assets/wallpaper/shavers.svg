<circle cx="650" cy="660" r="88" fill="none" stroke="#a8a8a0" stroke-width="16" stroke-dasharray="30 13" class="turn" style="--a:80deg;animation-duration:52s;transform-origin:650px 660px;transform-box:view-box"/>
<circle cx="650" cy="660" r="58" fill="none" stroke="#a8a8a0" stroke-width="14" stroke-dasharray="18 10" class="turn" style="--a:80deg;animation-duration:38s;transform-origin:650px 660px;transform-box:view-box"/>
<circle cx="650" cy="660" r="22" fill="#a8a8a0"/></svg>