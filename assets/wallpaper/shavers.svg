<circle cx="350" cy="660" r="58" fill="none" stroke="#ecece6" stroke-width="14" stroke-dasharray="18 10" class="turn" style="--a:40deg;animation-duration:38s;transform-origin:350px 660px;transform-box:view-box"/>
