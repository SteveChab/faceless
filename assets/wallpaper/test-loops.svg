<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 1000" role="img" aria-label="test loops artwork by dithereal: a triangle, square, pentagon and heptagon sharing one top vertex"><style>svg [class]{transform-box:fill-box;transform-origin:center;animation-iteration-count:infinite;animation-timing-function:ease-in-out}
.pivot{animation-name:pivot;animation-direction:alternate}
@keyframes pivot{from{transform:rotate(calc(var(--d) * -1))}to{transform:rotate(var(--d))}}
.fade{animation-name:fade}
@keyframes fade{50%{opacity:.35}}
.swell{animation-name:swell}
@keyframes swell{0%,100%{transform:scale(.55)}50%{transform:scale(1.2)}}
.sweep{animation-name:sweep}
@keyframes sweep{0%,100%{opacity:.25}50%{opacity:1}}
.glow{animation-name:glow}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 0 #7fff00)}50%{filter:drop-shadow(0 0 7px #7fff00)}}
.lid{animation-name:lid;animation-duration:8s}
@keyframes lid{0%,62%,100%{transform:scaleY(1)}70%,80%{transform:scaleY(.03)}90%{transform:scaleY(1)}}
path.lid{vector-effect:non-scaling-stroke}
.ripple{animation-name:ripple;animation-duration:6s}
@keyframes ripple{0%,100%{transform:scaleY(.7)}50%{transform:scaleY(1.2)}}
.reel{animation-name:spin;animation-timing-function:linear}
@keyframes spin{to{transform:rotate(360deg)}}
.turn{animation-name:spinfrom;animation-timing-function:linear}
@keyframes spinfrom{from{transform:rotate(var(--a))}to{transform:rotate(calc(var(--a) + 360deg))}}
.dust{animation-name:dust}
@keyframes dust{0%,100%{transform:translate(0,0);opacity:.2}50%{transform:translate(var(--dx),var(--dy));opacity:1}}
.fur{animation-name:fur;animation-direction:alternate}
@keyframes fur{from{transform:rotate(calc(var(--d) * -1)) scale(1)}to{transform:rotate(var(--d)) scale(var(--s))}}
.fur{vector-effect:non-scaling-stroke}
.wink{animation-name:wink;animation-duration:6s}
@keyframes wink{0%,55%,100%{transform:scaleY(1)}62%,72%{transform:scaleY(.08)}80%{transform:scaleY(1)}}
.slice{animation-name:slice;animation-duration:8s;animation-timing-function:steps(1,end)}
@keyframes slice{0%,90%{translate:0 0}92%{translate:var(--j) 0}94%{translate:calc(var(--j) * -.5) 0}96%{translate:calc(var(--j) * .3) 0}98%,100%{translate:0 0}}
.flicker{animation-name:flicker;animation-timing-function:steps(1,end)}
@keyframes flicker{0%,70%{opacity:1}72%{opacity:.2}75%{opacity:1}78%{opacity:.4}80%,100%{opacity:1}}
.drip{animation-name:drip;transform-origin:50% 0}
@keyframes drip{0%,100%{transform:scaleY(.5)}50%{transform:scaleY(1.12)}}
.bob{animation-name:bob}
@keyframes bob{0%,100%{transform:translateY(-16px)}50%{transform:translateY(16px)}}
.puddle{animation-name:puddle}
@keyframes puddle{0%,100%{transform:scaleX(.88)}50%{transform:scaleX(1.12)}}
.sun{animation-name:sun;animation-duration:7s!important}
@keyframes sun{0%,100%{transform:scale(.92);filter:drop-shadow(0 0 0 #7fff00)}50%{transform:scale(1.14);filter:drop-shadow(0 0 40px #7fff00)}}
.ring{animation-name:ring;animation-duration:8s}
@keyframes ring{0%,100%{opacity:.2}50%{opacity:1}}
.twinkle{animation-name:twinkle}
@keyframes twinkle{0%,100%{opacity:.15}50%{opacity:1}}
.orbit{animation-name:spin}
.thick{animation-name:thick}
.gaze{animation-name:gaze;animation-duration:16s;transform-box:view-box}
@keyframes gaze{0%,18%,100%{transform:translate(0,0)}30%,50%{transform:translate(-26px,-5px)}62%,82%{transform:translate(24px,7px)}}
.spokes{animation-name:spin;animation-duration:80s}
.glint{animation-name:spin;animation-direction:reverse}
.pupil{animation-name:pupil;animation-duration:9s}
@keyframes pupil{0%,100%{transform:scale(.72)}50%{transform:scale(1.12)}}
.drowsy{animation-name:drowsy;animation-duration:14s}
@keyframes drowsy{0%,30%,100%{transform:scaleY(1)}48%,66%{transform:scaleY(.5)}84%{transform:scaleY(1)}}
path.drowsy{vector-effect:non-scaling-stroke}
svg .reel,svg .turn,svg .orbit,svg .spokes,svg .glint{animation-timing-function:linear}
@keyframes thick{0%,100%{transform:scaleX(.6)}50%{transform:scaleX(2.4)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs></defs><rect width="1000" height="1000" fill="#121212"/><circle cx="500" cy="550" r="295" fill="none" stroke="#a8a8a0" stroke-width="2" class="fade" style="animation-duration:9s"/>
<polygon points="500.0,255.0 730.6,366.1 787.6,615.6 628.0,815.8 372.0,815.8 212.4,615.6 269.4,366.1" fill="none" stroke="#ecece6" stroke-width="3" stroke-opacity="0.55" stroke-linejoin="miter" class="pivot" style="--d:-5deg;animation-duration:14s;transform-origin:500px 255px;transform-box:view-box"/>
<polygon points="500.0,255.0 780.6,458.8 673.4,788.7 326.6,788.7 219.4,458.8" fill="none" stroke="#ecece6" stroke-width="3" stroke-opacity="0.7" stroke-linejoin="miter" class="pivot" style="--d:4deg;animation-duration:17s;transform-origin:500px 255px;transform-box:view-box"/>
<polygon points="500.0,255.0 795.0,550.0 500.0,845.0 205.0,550.0" fill="none" stroke="#ecece6" stroke-width="3" stroke-opacity="0.85" stroke-linejoin="miter" class="pivot" style="--d:-6deg;animation-duration:21s;transform-origin:500px 255px;transform-box:view-box"/>
<polygon points="500.0,255.0 755.5,697.5 244.5,697.5" fill="none" stroke="#7fff00" stroke-width="3" stroke-opacity="1" stroke-linejoin="miter" class="pivot" style="--d:7deg;animation-duration:25s;transform-origin:500px 255px;transform-box:view-box"/></svg>